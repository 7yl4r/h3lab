<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>South Florida regional &mdash; H3 hexagon time series</title>

<link rel="stylesheet" href="https://esm.sh/maplibre-gl@4.7.1/dist/maplibre-gl.css" />

<script type="importmap">
{
  "imports": {
    "maplibre-gl": "https://esm.sh/maplibre-gl@4.7.1"
  }
}
</script>

<style>
:root{
  --bg:#12141a; --panel:#1a1d26; --panel2:#222633; --line:#333a4a;
  --fg:#e7eaf0; --muted:#98a2b8; --accent:#7fd4c1; --warn:#e0a458; --bad:#e07a6a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
  font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{background:rgba(18,20,26,.75)!important;font-size:10px}
.maplibregl-ctrl-attrib a{color:#8b93a7!important}

#bar{position:absolute;top:0;left:0;right:0;z-index:10;display:flex;gap:12px;
  align-items:center;flex-wrap:wrap;padding:8px 13px;background:rgba(18,20,26,.93);
  border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
#bar h1{font-size:13px;margin:0;font-weight:650;white-space:nowrap}
#bar h1 small{color:var(--muted);font-weight:400;font-size:11px}
.ctl{display:flex;align-items:center;gap:5px}
.ctl label{color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.5px}
select,button{background:var(--panel2);color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:5px 8px;font:inherit;font-size:12px;cursor:pointer}
select:hover,button:hover{border-color:#4a556e}
button.on{background:var(--accent);color:#0d1412;border-color:var(--accent);font-weight:600}
input[type=range]{accent-color:var(--accent)}
.spacer{flex:1}

/* ---- timeline: two levels, months above bins ---------------------- */
#time{position:absolute;left:14px;bottom:14px;z-index:10;background:rgba(18,20,26,.94);
  border:1px solid var(--line);border-radius:10px;padding:10px 13px;backdrop-filter:blur(8px)}
#time .row{display:flex;align-items:center;gap:9px}
#time .per{font-variant-numeric:tabular-nums;font-weight:650;min-width:118px}
#tl{width:min(620px,62vw);margin-top:8px;user-select:none}
.tlrow{position:relative;height:26px}
.tlrow.months{height:20px}
.tlrow.months .mseg{position:absolute;top:0;height:14px;border-radius:2px;
  background:#232838;border:1px solid #2f3648;font-size:9px;color:#8e97ab;
  display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.tlrow.months .mseg.has{background:#2b3347;color:#b9c1d2}
.tlrow.months .mseg.cur{background:var(--accent);color:#0d1412;font-weight:700}
.tlrow.months .mseg:hover{border-color:#6d7896}
.tlrow.months .mname{pointer-events:none}
.tlrow.months .ev{position:absolute;top:15px;transform:translateX(-50%);font-size:8.5px;
  color:var(--warn);white-space:nowrap;pointer-events:auto;cursor:help}
.tlrow.months .ev::before{content:"";position:absolute;left:50%;top:-4px;width:1px;height:4px;
  background:var(--warn);opacity:.5}
.tlrow.bins{height:22px;margin-top:2px}
.tlrow.bins .btick{position:absolute;bottom:0;width:9px;height:9px;border-radius:2px;
  background:#39405a;transform:translateX(-50%)}
.tlrow.bins .btick:hover{background:#5a6484}
.tlrow.bins .btick.cur{background:var(--accent);height:13px}
.tlrow.bins .btick.off{background:#20242f;opacity:.5}
.tlrow.bins .bmark{position:absolute;bottom:0;transform:translateX(-50%);font-size:8.5px;
  color:var(--muted);white-space:nowrap;pointer-events:none}
#tlaxis{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);
  margin-top:1px}

#legend{position:absolute;right:14px;bottom:14px;z-index:10;background:rgba(18,20,26,.94);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:210px;
  backdrop-filter:blur(8px);font-size:11.5px}
#legend h3{margin:0 0 7px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.ramp{height:11px;border-radius:3px;margin:4px 0 3px;border:1px solid var(--line)}
.rlabels{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}
.lrow{display:flex;align-items:center;gap:7px;margin:3px 0}
.sw{width:14px;height:14px;border-radius:3px;flex:0 0 auto;border:1px solid rgba(255,255,255,.14)}
.hintline{color:var(--muted);font-size:10.5px;margin-top:6px}

#status{position:absolute;right:14px;top:var(--paneltop,58px);z-index:10;width:250px;
  background:rgba(18,20,26,.94);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;backdrop-filter:blur(8px);font-size:11.5px;max-height:52vh;overflow-y:auto}
#status h3{margin:0 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.sh{display:flex;align-items:center;gap:6px;padding:2px 0;font-variant-numeric:tabular-nums}
.sh .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.sh .nm{font-family:ui-monospace,monospace;font-size:10.5px;color:#aab2c4}
.sh .st{margin-left:auto;font-size:10px;color:var(--muted)}

#extremes{position:absolute;right:14px;top:var(--paneltop,58px);z-index:10;width:250px;
  background:rgba(18,20,26,.94);border:1px solid var(--line);border-radius:10px;
  padding:9px 12px;backdrop-filter:blur(8px);max-height:46vh;overflow-y:auto;display:none}
#extremes h3{margin:0 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.ex{cursor:pointer;padding:3px 5px;border-radius:5px;display:flex;gap:7px;align-items:center}
.ex:hover{background:var(--panel2)}
.ex .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;
  font-family:ui-monospace,monospace}
.ex .vl{font-variant-numeric:tabular-nums;font-weight:650}

#insp{position:absolute;top:var(--paneltop,58px);left:14px;z-index:10;width:444px;
  max-height:calc(100vh - 230px);overflow-y:auto;background:rgba(18,20,26,.96);
  border:1px solid var(--line);border-radius:12px;backdrop-filter:blur(10px);
  padding:14px 15px;box-shadow:0 10px 34px rgba(0,0,0,.45)}
#insp h2{margin:0 0 3px;font-size:14px;font-weight:650}
.sub{color:var(--muted);font-size:11.5px;margin-bottom:11px}
.sub code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:11px;color:var(--accent)}
.narr{background:var(--panel2);border-left:3px solid var(--accent);border-radius:0 7px 7px 0;
  padding:9px 11px;margin:0 0 12px;font-size:12.5px}
.narr b{color:var(--accent)}
.sect{margin:14px 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;margin:7px 0}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:11.5px}
.kv b{font-weight:600;font-variant-numeric:tabular-nums}
.kv span{color:var(--muted)}
.ribbon{display:flex;gap:2px;margin:8px 0 4px}
.rseg{flex:1;height:26px;border-radius:4px;display:flex;align-items:flex-end;justify-content:center;
  font-size:8px;color:#0b0d11;font-weight:700;padding-bottom:1px;cursor:pointer}
.rseg.sel{outline:2px solid #fff;outline-offset:-2px}
.rseg.dim{opacity:.2}
.riblabels{display:flex;gap:2px;font-size:9px;color:var(--muted)}.riblabels div{flex:1;text-align:center}
.chart{width:100%;height:auto;display:block}
.heatleg{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px;font-size:9.5px;color:var(--muted)}
.heatleg .hlbar{display:flex;height:9px;border-radius:2px;overflow:hidden}
.heatleg .hlbar i{display:block;width:13px;height:9px}
.heatleg .hlmiss{display:inline-block;width:13px;height:9px;border-radius:2px;background:#0b0d12;border:1px solid #2c3242}
.close{position:absolute;top:10px;right:12px;background:none;border:none;color:var(--muted);
  font-size:19px;line-height:1;padding:2px 5px}
.close:hover{color:#fff}
.hint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:9;color:var(--muted);
  font-size:11.5px;background:rgba(18,20,26,.9);padding:6px 13px;border-radius:20px;
  border:1px solid var(--line);pointer-events:none;transition:opacity .4s}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  z-index:50;background:var(--bg);font-size:14px;color:var(--muted);flex-direction:column;gap:12px}
.bar2{width:240px;height:3px;background:var(--panel2);border-radius:2px;overflow:hidden}
.bar2 div{height:100%;width:30%;background:var(--accent);animation:sl 1.05s infinite ease-in-out}
@keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(370%)}}
.kbd{font-family:ui-monospace,monospace;background:var(--panel2);border:1px solid var(--line);
  border-radius:3px;padding:0 4px;font-size:10.5px}
#diag{position:absolute;left:50%;transform:translateX(-50%);top:var(--paneltop,58px);z-index:9;
  color:var(--muted);font-size:10.5px;background:rgba(18,20,26,.88);padding:3px 10px;
  border-radius:20px;border:1px solid var(--line);pointer-events:none;
  font-variant-numeric:tabular-nums;max-width:60vw;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
</style>
</head>
<body>

<div id="map"></div>

<div id="bar">
  <a href="./" title="all viewers" style="color:var(--muted);text-decoration:none;font-size:12px;white-space:nowrap">&larr; viewers</a>
  <h1>South Florida regional <small id="srcline"></small></h1>
  <div class="ctl"><label>Detail</label><select id="resmode">
    <option value="overview">res 7 overview</option>
    <option value="regions">res 8 regions</option>
    <option value="both">both</option></select></div>
  <div class="ctl"><label>Colour</label><select id="colormode"></select></div>
  <div class="ctl" id="changectl" style="display:none"><label>break by</label>
    <select id="changemetric">
      <option value="date">break date</option>
      <option value="magnitude">break size</option>
      <option value="score">break strength</option></select></div>
  <div class="ctl"><label>Season</label><select id="season">
    <option value="all">whole year</option>
    <option value="wet">wet (May–Oct)</option>
    <option value="dry">dry (Nov–Apr)</option></select></div>
  <div class="ctl"><label>Baseline</label><select id="baseline"></select></div>
  <div class="ctl"><label>Opacity</label><input type="range" id="opacity" min="15" max="100" value="85" style="width:96px" /></div>
  <div class="spacer"></div>
  <div class="ctl"><label>Satellite</label><button id="basemap" class="on">on</button></div>
</div>

<div id="diag"></div>

<div id="time">
  <div class="row">
    <button id="play" title="Play / pause (space)">&#9654;</button>
    <div class="per" id="perlabel">&mdash;</div>
    <div class="ctl"><label>Bin</label><input type="range" id="slider" min="0" max="0" value="0" style="width:190px" /></div>
    <div class="ctl"><label>Speed</label><select id="speed">
      <option value="1600">slow</option><option value="900" selected>normal</option><option value="420">fast</option></select></div>
  </div>
  <div id="tl">
    <div class="tlrow months" id="tlmonths"></div>
    <div class="tlrow bins" id="tlbins"></div>
    <div id="tlaxis"><span id="tl0"></span><span id="tl1"></span></div>
  </div>
</div>

<div id="legend"></div>
<div id="status"></div>
<div id="extremes"></div>
<div id="insp" style="display:none"></div>
<div class="hint" id="hint">Click any hexagon for its biography &nbsp;&middot;&nbsp; <span class="kbd">space</span> play &nbsp; <span class="kbd">&larr;</span><span class="kbd">&rarr;</span> step &nbsp; <span class="kbd">esc</span> close</div>

<div id="loading"><div>loading regional manifest</div><div class="bar2"><div></div></div></div>

<script type="module">
import maplibregl from 'maplibre-gl';

const $ = s => document.querySelector(s);
const BASE = '../data/regional';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=(v,n=3)=>v==null||!isFinite(v)?'&mdash;':v.toFixed(n);
const isMissing = v => v==null || (typeof v==='number' && Number.isNaN(v));

/* ---------------------------------------------------------------- state */
const S={
  manifest:null,
  periods:[],                 // [{bin,date,start,end,year,month,season}]
  season:'all',
  overview:null,              // decoded res-7 block
  shards:new Map(),           // region id -> decoded res-8 block
  pending:new Map(),          // region id -> Promise
  resMode:'overview',
  mode:'ndvi',
  changeMetric:'date',
  periodIdx:0, baselineIdx:0,
  opacity:85, satellite:true, selected:null,
  playing:false, timer:null, speed:900,
  extremes:[]
};

/* ---------------------------------------------------------------- palettes */
const RAMPS={
  veg:[[122,94,62],[192,177,112],[150,186,96],[70,145,70],[20,95,55]],
  water:[[168,148,100],[142,182,192],[70,140,190],[30,80,170]],
  fire:[[60,110,90],[182,200,120],[236,170,70],[215,90,60],[150,30,40]],
  diff:[[40,90,170],[120,160,190],[236,236,232],[240,180,110],[180,50,50]],
  frac:[[25,28,36],[45,80,80],[70,150,110],[120,200,140],[200,240,180]],
  stab:[[38,158,140],[120,200,182],[240,222,168],[232,150,78],[198,66,66]],
  // break timing: early -> late across the year
  time:[[58,76,150],[86,150,180],[140,196,150],[222,196,104],[226,128,86],[196,64,86]]
};
const NODATA='#282b34';

function hex(v){ return '#'+v.map(c=>clamp(Math.round(c),0,255).toString(16).padStart(2,'0')).join(''); }
function rampColor(t,stops){
  if(t==null||!isFinite(t)) return '#3a3c46';
  t=clamp(t,0,1);
  const x=t*(stops.length-1), i=Math.min(Math.floor(x),stops.length-2), f=x-i;
  const a=stops[i], b=stops[i+1];
  return hex([0,1,2].map(k=>a[k]+(b[k]-a[k])*f));
}
const DELTA_SPAN = 0.3;
const BAND_SPAN = {blue:0.20, green:0.30, red:0.30, nir:0.60, swir1:0.50, swir2:0.40};
RAMPS.spec=[[12,14,22],[58,62,84],[128,132,150],[232,222,192]];
const DOMAIN_RAMP = {greenness:'veg','open water':'water','canopy moisture':'frac','burn / bare substrate':'fire'};
function spec(k){ return (S.manifest.index_specs||{})[k]||{}; }
function idxRange(k){ const r=spec(k).range; return r||[-1,1]; }
function idxRamp(k){ const dom=spec(k).domain; return RAMPS[DOMAIN_RAMP[dom]||'veg']; }
function idxLabel(k){ return spec(k).label||k.toUpperCase(); }

const BAND_COLORS = {blue:'#4d8dfa',green:'#31c275',red:'#f4574f',nir:'#e8499f',swir1:'#b25ff0',swir2:'#5f7cf2'};
function bandColor(b){ return BAND_COLORS[b]||'#9aa4bb'; }
function bandLabel(b){ const i=(S.manifest.band_info||{})[b]; return i?`${i.label} ${i.nm}nm`:b; }
const INDEX_COLORS = {ndvi:'#7fd4a1',ndwi:'#6aa9e0',mndwi:'#b48ee0',ndmi:'#e0c060',nbr:'#e07a6a',savi:'#5fd0d0'};

/* ---------------------------------------------------------------- load */
async function fetchJSON(url){
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok) throw new Error(`${url} -> HTTP ${r.status}`);
  return r.json();
}
async function fetchBytes(url){
  const t0=performance.now();
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok) throw new Error(`${url} -> HTTP ${r.status}`);
  const b=new Uint8Array(await r.arrayBuffer());
  mark('fetch '+url.split('/').pop(), performance.now()-t0, `${(b.length/1048576).toFixed(2)} MB`);
  return b;
}
async function gunzip(bytes){
  const t0=performance.now();
  if(typeof DecompressionStream==='undefined')
    throw new Error('This browser has no DecompressionStream.');
  const ds=new DecompressionStream('gzip');
  const stream=new Blob([bytes]).stream().pipeThrough(ds);
  const reader=stream.getReader();
  const parts=[];
  for(;;){ const {done,value}=await reader.read(); if(done) break; parts.push(value); }
  const total=parts.reduce((a,b)=>a+b.length,0);
  const out=new Uint8Array(total); let p=0;
  for(const part of parts){ out.set(part,p); p+=part.length; }
  mark('inflate', performance.now()-t0, `${(bytes.length/1048576).toFixed(2)} -> ${(total/1048576).toFixed(2)} MB`);
  return out;
}

const DIAG=[];
function mark(stage,ms,note){
  DIAG.push({stage,ms:Math.round(ms),note:note||''});
  const el=$('#diag');
  if(el){
    el.textContent=DIAG.map(d=>`${d.stage} ${d.ms}ms`).join(' · ');
    el.title=DIAG.map(d=>`${d.stage}: ${d.ms}ms ${d.note}`).join('\n');
  }
}

/** Decode one H3LB bundle.
 *
 *  Two field shapes exist in the bundle and they are not interchangeable:
 *  the observation fields are (nPeriods, nCells) and the change fields are
 *  (nCells,) -- one value per cell, not one per period. Reading a 1-D field
 *  as if it were period-major would silently shift every cell's value by a
 *  whole period, so the two accessors are kept apart.
 */
function decodeBlock(buffer){
  const t0=performance.now();
  const dv=new DataView(buffer);
  if(dv.getUint32(0,true)!==0x424C3348) throw new Error('not an H3LB bundle (bad magic)');
  const descLen=dv.getUint32(8,true);
  const desc=JSON.parse(new TextDecoder().decode(new Uint8Array(buffer,16,descLen)));
  const MISSING=desc.missing, C=desc.nCells, P=desc.nPeriods;

  // JavaScript's % keeps the sign of the dividend, so (-off) % 16 is negative
  // for any off that is not already a multiple of 16 -- Python's is not.
  const align16 = x => ((-x) % 16 + 16) % 16;
  let off=16+descLen+align16(16+descLen);
  const raw={};
  for(const f of desc.fields){
    const n=f.shape.reduce((a,b)=>a*b,1);
    if(f.dtype==='u8') raw[f.name]=new Uint8Array(buffer,off,n);
    else                 raw[f.name]=new Uint16Array(buffer,off,n);
    off += (f.dtype==='u8' ? n : n*2);
    off += align16(off);
  }
  if(off!==buffer.byteLength)
    throw new Error(`bundle truncated: consumed ${off} of ${buffer.byteLength} bytes`);

  const cache={};
  /** period-major float field -> array of P Float32Array(C). */
  function perPeriod(name){
    if(cache[name]) return cache[name];
    const f=desc.fields.find(x=>x.name===name);
    if(!f) return null;
    const src=raw[name];
    const flat=new Float32Array(P*C);
    for(let k=0;k<P*C;k++){
      const q=src[k];
      flat[k]=(q===MISSING)?NaN:f.min+q*f.scale;
    }
    const out=[];
    for(let i=0;i<P;i++) out.push(flat.subarray(i*C,(i+1)*C));
    return (cache[name]=out);
  }
  /** period-major raw field (no dequantisation). */
  function typed(name){
    if(cache[name]) return cache[name];
    if(!raw[name]) return null;
    const src=raw[name]; const out=[];
    for(let i=0;i<P;i++) out.push(src.subarray(i*C,(i+1)*C));
    return (cache[name]=out);
  }
  /** per-cell field: one value per cell, no time axis. */
  function perCell(name){
    if(cache[name]) return cache[name];
    if(!raw[name]) return null;
    return (cache[name]=raw[name]);
  }
  /** per-cell float field (dequantised), NaN where missing. */
  function perCellFloat(name){
    if(cache[name]) return cache[name];
    if(!raw[name]) return null;
    const f=desc.fields.find(x=>x.name===name);
    const src=raw[name];
    const out=new Float32Array(C);
    for(let i=0;i<C;i++){
      const q=src[i];
      out[i]=(q===MISSING)?NaN:(f.min!=null?f.min+q*f.scale:q);
    }
    return (cache[name]=out);
  }

  const block={
    periods:desc.periods, nCells:C, ids:desc.ids,
    lon:desc.lon, lat:desc.lat, areaKm2:desc.areaKm2,
    band:{}, index:{},
    epoch:desc.epoch, binDays:desc.binDays,
    changeMethods:desc.changeMethods||null
  };
  for(const [g,names] of [['band',desc.bands],['index',desc.indices]])
    for(const nm of names) block[g][nm]=perPeriod(`${g}.${nm}`);
  block.validFraction=perPeriod('validFraction');
  block.observed=typed('observed');
  block.nObs=typed('nObs');

  // change layer (res-8 shards only)
  if(desc.changeMethods){
    block.change={
      break_bin:perCell('break_bin'),
      break_date:perCell('break_date'),
      break_magnitude:perCellFloat('break_magnitude'),
      break_score:perCellFloat('break_score'),
      n_obs_used:perCell('n_obs_used'),
      method:perCell('method'),
      methods:desc.changeMethods
    };
  }

  // baked hexagon outlines
  const gf=desc.fields.find(x=>x.name==='geomXY');
  const gv=raw.geomVerts, gq=raw.geomXY;
  const nGeo=gq.length>>1;
  const gxy=new Float32Array(nGeo*2);
  for(let i=0;i<nGeo;i++){
    gxy[i*2]  = gf.lonLo + gq[i*2]  * gf.gscaleX;
    gxy[i*2+1]= gf.latLo + gq[i*2+1]* gf.gscaleY;
  }
  block._geomVerts=gv; block._geomXY=gxy;
  block._dequant=descLen;
  mark('decode '+C.toLocaleString()+' cells', performance.now()-t0, `${P} periods`);
  return block;
}

/* ---------------------------------------------------------------- boot */
async function boot(){
  try{
    const t0=performance.now();
    S.manifest = await fetchJSON(`${BASE}/manifest.json`);
    mark('manifest', performance.now()-t0, `${S.manifest.regions.length} regions`);
  }catch(err){
    $('#loading').innerHTML=
      `<div style="max-width:620px;text-align:center;line-height:1.75">
        <div style="color:#e0a458;font-size:15px;margin-bottom:8px">could not load the regional manifest</div>
        <div>${err.message}</div>
        <div style="margin-top:14px;color:#98a2b8;font-size:12px">
          Build the regional bundle first:<br><br>
          <code>export PYTHONPATH=$PWD/src &amp;&amp; python -m h3lab.run_regional --year 2017 --resolutions 7,8</code><br><br>
          Browsers block <code>fetch</code> on <code>file://</code>, so serve the folder over HTTP:<br>
          <code>cd h3lab &amp;&amp; ./serve.sh</code> then open
          <code>http://localhost:8000/viewer/regional.html</code></div></div>`;
    return;
  }

  const m=S.manifest;
  // The season is derived from the *date*, never from the bin number: 16-day
  // bins do not divide the year, so bin_index mod anything is meaningless
  // (D-18). wet = May..Oct, dry = Nov..Apr.
  S.periods = m.periods.map(p=>{
    const d=new Date(p.date+'T00:00:00Z');
    const month=d.getUTCMonth()+1;
    return {...p, month, season:(month>=5&&month<=10)?'wet':'dry'};
  });
  $('#srcline').textContent = `${m.name} · ${m.periods.length} bins · ${m.regions.length} regions`;
  document.title = `${m.name} — H3 regional time series`;

  setupModes();
  setupMap();

  try{
    const gz=await fetchBytes(`${BASE}/${m.overview.file}`);
    const raw=await gunzip(gz);
    S.overview=decodeBlock(raw.buffer.slice(raw.byteOffset,raw.byteOffset+raw.byteLength));
  }catch(err){
    failLoading(err); return;
  }
  hideLoading();

  S.periodIdx=S.periods.length-1;
  S.baselineIdx=0;
  buildGeometry();
  buildBaselineOptions();
  buildTimeline();
  buildSlider();
  recolor();
  buildLegend();
  fitToData();
  updateStatus();
  setTimeout(()=>{const h=$('#hint'); if(h) h.style.opacity=0;}, 9000);
}

function setupModes(){
  const m=S.manifest;
  const sel=$('#colormode'); sel.innerHTML='';
  const add=(val,label,group)=>{
    const o=document.createElement('option');
    o.value=val; o.textContent=label;
    if(group){ const g=document.createElement('optgroup'); g.label=group; sel.appendChild(g); }
    else sel.appendChild(o);
  };
  for(const k of m.indices) add(k, idxLabel(k));
  add('delta','change vs baseline');
  for(const b of m.bands) add('band:'+b, `reflectance · ${b}`, 'reflectance');
  const g=document.createElement('optgroup'); g.label='change layer';
  const o=document.createElement('option'); o.value='change'; o.textContent='detected break';
  g.appendChild(o); sel.appendChild(g);
  sel.value=S.mode;
  sel.onchange=()=>{ S.mode=sel.value; $('#changectl').style.display=S.mode==='change'?'':'none'; recolor(); buildLegend(); };
}

/* ---------------------------------------------------------------- geometry */
function buildGeometry(){
  const B=S.overview;
  FC7={type:'FeatureCollection',features:[]};
  let p=0;
  const nv=B._geomVerts, gx=B._geomXY;
  for(let i=0;i<B.nCells;i++){
    const k=nv[i];
    const coords=new Array(k+1);
    for(let j=0;j<k;j++){ coords[j]=[gx[p++],gx[p++]]; }
    coords[k]=[coords[0][0],coords[0][1]];
    FC7.features.push({type:'Feature',properties:{id:B.ids[i],color:NODATA},
                       geometry:{type:'Polygon',coordinates:[coords]}});
  }
}
function featuresFor(block){
  const FC={type:'FeatureCollection',features:[]};
  let p=0;
  const nv=block._geomVerts, gx=block._geomXY;
  for(let i=0;i<block.nCells;i++){
    const k=nv[i];
    const coords=new Array(k+1);
    for(let j=0;j<k;j++){ coords[j]=[gx[p++],gx[p++]]; }
    coords[k]=[coords[0][0],coords[0][1]];
    FC.features.push({type:'Feature',properties:{id:block.ids[i],color:NODATA},
                      geometry:{type:'Polygon',coordinates:[coords]}});
  }
  return FC;
}

/* ---------------------------------------------------------------- colours */
function isChangeMode(){ return S.mode==='change'; }

function coloursFor(block, periodIdx){
  const key=S.mode+'|'+S.baselineIdx+'|'+S.changeMetric;
  if(block._cc && block._cc.key===key) return block._cc.periods[periodIdx];
  const n=block.nCells, P=block.periods.length;
  const periods=[];
  if(isChangeMode()){
    // The change layer is per cell, not per period: one colour per cell.
    const col=new Array(n).fill(NODATA);
    const ch=block.change;
    if(ch){
      const metric=S.changeMetric;
      if(metric==='date'){
        const d=block._geomXY;   // not used, but keeps the branch symmetric
        void d;
        const vals=ch.break_date;
        let lo=Infinity, hi=-Infinity;
        for(let c=0;c<n;c++){ const v=vals[c]; if(v!==65535){ if(v<lo)lo=v; if(v>hi)hi=v; } }
        for(let c=0;c<n;c++){
          const v=vals[c];
          col[c]= (v===65535||!isFinite(hi)||hi<=lo) ? NODATA
                  : rampColor((v-lo)/(hi-lo), RAMPS.time);
        }
      }else if(metric==='magnitude'){
        const vals=ch.break_magnitude;
        let m=0;
        for(let c=0;c<n;c++){ const v=Math.abs(vals[c]); if(isFinite(v)&&v>m) m=v; }
        for(let c=0;c<n;c++){
          const v=vals[c];
          col[c]= isFinite(v)&&m>0 ? rampColor(Math.abs(v)/m, RAMPS.fire) : NODATA;
        }
      }else{
        const vals=ch.break_score;
        let m=0;
        for(let c=0;c<n;c++){ const v=vals[c]; if(isFinite(v)&&v>m) m=v; }
        for(let c=0;c<n;c++){
          const v=vals[c];
          col[c]= isFinite(v)&&m>0 ? rampColor(v/m, RAMPS.stab) : NODATA;
        }
      }
    }
    block._cc={key, periods:[col]};
    return col;
  }
  for(let i=0;i<P;i++){
    const out=new Array(n);
    if(S.mode==='delta'){
      const arr=block.index[S.deltaIdx||'ndvi'];
      for(let c=0;c<n;c++){
        const a=arr[S.baselineIdx][c], b=arr[i][c];
        if(!block.observed[i][c]||!block.observed[S.baselineIdx][c]||isMissing(a)||isMissing(b)){
          out[c]=NODATA; continue;
        }
        out[c]=rampColor((b-a)/DELTA_SPAN+0.5, RAMPS.diff);
      }
    }else if(S.mode.startsWith('band:')){
      const band=S.mode.slice(5);
      const arr=block.band[band][i];
      for(let c=0;c<n;c++){
        const v=arr[c];
        if(!block.observed[i][c]||isMissing(v)){ out[c]=NODATA; continue; }
        out[c]=rampColor(clamp(v/BAND_SPAN[band],0,1), RAMPS.spec);
      }
    }else{
      const key=S.mode;
      const arr=block.index[key][i];
      const lo=idxRange(key)[0], hi=idxRange(key)[1];
      for(let c=0;c<n;c++){
        const v=arr[c];
        if(!block.observed[i][c]||isMissing(v)){ out[c]=NODATA; continue; }
        out[c]=rampColor((v-lo)/(hi-lo), idxRamp(key));
      }
    }
    periods.push(out);
  }
  block._cc={key, periods};
  return periods[periodIdx];
}

function recolor(){
  const col7=coloursFor(S.overview, S.periodIdx);
  for(let i=0;i<FC7.features.length;i++) FC7.features[i].properties.color=col7[i];
  if(S.map && S.map.getSource('ov')) S.map.getSource('ov').setData(FC7);

  for(const [region,block] of S.shards){
    const col=coloursFor(block, S.periodIdx);
    const fc=S.shardFC.get(region);
    if(!fc) continue;
    for(let i=0;i<fc.features.length;i++) fc.features[i].properties.color=col[i];
    if(S.map && S.map.getSource('rg')) S.map.getSource('rg').setData(S.shardCollection());
  }
  $('#perlabel').textContent=periodLabel(S.periodIdx);
  document.querySelectorAll('.btick').forEach(t=>t.classList.toggle('cur',Number(t.dataset.k)===S.periodIdx));
  document.querySelectorAll('.mseg').forEach(t=>t.classList.toggle('cur',Number(t.dataset.k)===curMonthKey()));
  if(isChangeMode()) buildExtremes();
}

function periodLabel(i){
  const p=S.periods[i];
  return p ? `${p.date} · bin ${p.bin} · ${p.season}` : '&mdash;';
}

/* ---------------------------------------------------------------- map */
function setupMap(){
  const [w,s,e,n]=S.manifest.bbox;
  S.shardFC=new Map();
  S.map=new maplibregl.Map({
    container:'map',
    style:{version:8,sources:{sat:{type:'raster',tiles:[
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
        tileSize:256}},layers:[
      {id:'bg',type:'background',paint:{'background-color':'#0b0d12'}},
      {id:'basemap',type:'raster',source:'sat'}]},
    center:[(w+e)/2,(s+n)/2], zoom:8.4, attributionControl:false, maxZoom:19
  });
  S.map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');
  S.map.addControl(new maplibregl.AttributionControl({
    customAttribution:'Landsat C2 L2 via Microsoft Planetary Computer · Hexagons: Uber H3'}));

  let tileFails=0;
  S.map.on('error',ev=>{
    const m=ev&&ev.error&&String(ev.error.message||'');
    if(!m||!/tile|source|sprite|glyph|fetch|network/i.test(m)) return;
    tileFails++;
    if(tileFails===6) dropBasemap('basemap tiles unreachable');
  });

  let layersAdded=false;
  function addLayers(){
    if(layersAdded||!S.map) return;
    if(!S.map.isStyleLoaded && !S.map.getStyle()) return;
    if(!S.map.getLayer('basemap')) { try{ addBasemap(); }catch(e){} }
    layersAdded=true;
    S.map.addSource('ov',{type:'geojson',data:FC7||{type:'FeatureCollection',features:[]}});
    S.map.addSource('rg',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
    S.map.addLayer({id:'ov-line',type:'line',source:'ov',paint:{'line-color':'rgba(0,0,0,0.25)','line-width':0.3}});
    S.map.addLayer({id:'ov-fill',type:'fill',source:'ov',paint:{
      'fill-color':['coalesce',['get','color'],NODATA],'fill-opacity':S.opacity/100}});
    S.map.addLayer({id:'rg-line',type:'line',source:'rg',paint:{'line-color':'rgba(0,0,0,0.30)','line-width':0.4}});
    S.map.addLayer({id:'rg-fill',type:'fill',source:'rg',paint:{
      'fill-color':['coalesce',['get','color'],NODATA],'fill-opacity':S.opacity/100}});
    S.map.addLayer({id:'hex-sel',type:'line',source:'rg',filter:['==',['get','id'],'__none__'],
      paint:{'line-color':'#ffffff','line-width':2.4,'line-opacity':1}});
    S.map.on('click','ov-fill',ev=>pick(ev,'ov'));
    S.map.on('click','rg-fill',ev=>pick(ev,'rg'));
    S.map.on('mousemove','ov-fill',()=>{S.map.getCanvas().style.cursor='pointer';});
    S.map.on('mousemove','rg-fill',()=>{S.map.getCanvas().style.cursor='pointer';});
    S.map.on('mouseout','ov-fill',()=>{S.map.getCanvas().style.cursor='';});
    S.map.on('mouseout','rg-fill',()=>{S.map.getCanvas().style.cursor='';});
    applyResMode();
    updateStatus();
  }
  S.map.on('load',addLayers);
  S.map.on('style.load',addLayers);
  S.mapReady=addLayers;
  S.map.on('moveend',()=>{ loadVisibleShards(); });
}
function pick(ev, which){
  const f=ev.features&&ev.features[0];
  if(f) selectCell(String(f.properties.id), which);
}
function addBasemap(){
  S.map.addLayer({id:'basemap',type:'raster',source:'sat',paint:{'raster-opacity':0.85}});
}
function dropBasemap(why){
  if(S.map && S.map.getLayer('basemap')) S.map.setLayoutProperty('basemap','visibility','none');
  const b=$('#basemap'); if(b){ b.classList.remove('on'); b.disabled=true; b.textContent='off'; }
  console.warn('regional viewer:',why);
}
function applyResMode(){
  if(!S.map||!S.map.getLayer('ov-fill')) return;
  const showOv = S.resMode==='overview'||S.resMode==='both';
  const showRg = S.resMode==='regions'||S.resMode==='both';
  S.map.setLayoutProperty('ov-fill','visibility',showOv?'visible':'none');
  S.map.setLayoutProperty('ov-line','visibility',showOv?'visible':'none');
  S.map.setLayoutProperty('rg-fill','visibility',showRg?'visible':'none');
  S.map.setLayoutProperty('rg-line','visibility',showRg?'visible':'none');
}
function fitToData(){
  const b=S.manifest.bbox;
  S.map.fitBounds([[b[0]-0.06,b[1]-0.04],[b[2]+0.06,b[3]+0.04]],
    {padding:{top:70,bottom:190,left:70,right:280},duration:700});
}

/* ---------------------------------------------------------------- shards */
function shardCollection(){
  const feats=[];
  for(const fc of S.shardFC.values()) feats.push(...fc.features);
  return {type:'FeatureCollection',features:feats};
}
function visibleRegions(){
  if(!S.map) return [];
  const b=S.map.getBounds();
  const w=b.getWest(), e=b.getEast(), s=b.getSouth(), n=b.getNorth();
  return S.manifest.regions.filter(r=>{
    const rb=r.bbox;
    return !(rb[2]<w || rb[0]>e || rb[3]<s || rb[1]>n);
  });
}
async function loadVisibleShards(){
  if(!S.map||!S.mapReady) return;
  const want=visibleRegions();
  const wantSet=new Set(want.map(r=>r.region));
  // drop shards that scrolled out of view
  for(const region of [...S.shards.keys()]){
    if(!wantSet.has(region)){
      S.shards.delete(region);
      S.shardFC.delete(region);
    }
  }
  let loaded=0;
  for(const r of want){
    if(S.shards.has(r.region)) { loaded++; continue; }
    ensureShard(r).then(()=>{ recolor(); updateStatus(); });
  }
  updateStatus();
  if(want.length && S.resMode==='overview'){
    // The overview is res 7; the res-8 shards are still worth loading so the
    // region detail is ready the moment the user switches.
  }
}
async function ensureShard(r){
  if(S.pending.has(r.region)) return S.pending.get(r.region);
  const p=(async()=>{
    const gz=await fetchBytes(`${BASE}/${r.file}`);
    const raw=await gunzip(gz);
    const block=decodeBlock(raw.buffer.slice(raw.byteOffset,raw.byteOffset+raw.byteLength));
    S.shards.set(r.region, block);
    S.shardFC.set(r.region, featuresFor(block));
    if(S.map && S.map.getSource('rg')) S.map.getSource('rg').setData(shardCollection());
    updateStatus();
    return block;
  })();
  S.pending.set(r.region,p);
  try{ return await p; } finally { S.pending.delete(r.region); }
}
function updateStatus(){
  const el=$('#status');
  if(!el) return;
  const want=visibleRegions();
  const el2=$('#extremes');
  el2.style.display = isChangeMode() ? 'block' : 'none';
  if(!want.length){ el.innerHTML='<h3>regions</h3><div style="color:var(--muted)">none in view</div>'; return; }
  const rows=want.map(r=>{
    const st = S.shards.has(r.region) ? 'loaded'
             : S.pending.has(r.region) ? 'loading…'
             : 'queued';
    const dot = st==='loaded' ? '#7fd4c1' : st==='loading…' ? '#e0a458' : '#5a6484';
    const cells = S.shards.has(r.region) ? S.shards.get(r.region).nCells : r.nCells;
    return `<div class="sh"><span class="dot" style="background:${dot}"></span>
      <span class="nm">${r.region}</span>
      <span class="st">${cells.toLocaleString()} · ${st}</span></div>`;
  }).join('');
  const loaded=want.filter(r=>S.shards.has(r.region)).length;
  el.innerHTML=`<h3>regions <span style="float:right;font-weight:400">${loaded}/${want.length}</span></h3>${rows}
    <div style="color:var(--muted);font-size:10.5px;margin-top:6px">
      ${S.manifest.regions.length} region shards at res ${S.manifest.region_res}; loaded on demand.</div>`;
}

/* ---------------------------------------------------------------- timeline */
const MONTH_NAMES=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function curMonthKey(){
  const p=S.periods[S.periodIdx];
  return p?`${p.year}-${String(p.month).padStart(2,'0')}`:'';
}
function shownPeriods(){
  if(S.season==='all') return S.periods;
  return S.periods.filter(p=>p.season===S.season);
}
function buildTimeline(){
  const monthsEl=$('#tlmonths'), binsEl=$('#tlbins');
  monthsEl.innerHTML=''; binsEl.innerHTML='';
  if(!S.periods.length) return;
  const t0=Date.parse(S.periods[0].start+'T00:00:00Z');
  const t1=Date.parse(S.periods[S.periods.length-1].end+'T00:00:00Z');
  const span=Math.max(t1-t0,1);
  const pos=d=>clamp((d-t0)/span,0,1)*100;

  // ---- level 1: months ----
  const first=S.periods[0], last=S.periods[S.periods.length-1];
  let y=first.year, m=first.month;
  const endM=last.month, endY=last.year;
  while(true){
    const days=new Date(Date.UTC(y,m,0)).getUTCDate();
    const a=Date.UTC(y,m-1,1), b=Date.UTC(y,m,1);
    const key=`${y}-${String(m).padStart(2,'0')}`;
    const inSeason = S.season==='all'
      ? true
      : (S.season==='wet' ? (m>=5&&m<=10) : !(m>=5&&m<=10));
    const has=S.periods.some(p=>p.year===y&&p.month===m);
    const seg=document.createElement('div');
    seg.className='mseg'+(has?' has':'');
    seg.dataset.k=key;
    seg.style.left=pos(a)+'%';
    seg.style.width=Math.max(pos(b)-pos(a),0.4)+'%';
    seg.innerHTML=`<span class="mname">${MONTH_NAMES[m-1]}</span>`;
    seg.title=`${MONTH_NAMES[m-1]} ${y}`+(has?'':' — no bin centre in this month');
    seg.onclick=()=>{
      const i=S.periods.findIndex(p=>p.year===y&&p.month===m);
      if(i>=0) setPeriod(i);
    };
    monthsEl.appendChild(seg);
    if(y===endY&&m===endM) break;
    m++; if(m>12){ m=1; y++; }
    if(y>endY+1) break;
  }

  // event markers (Irma and friends)
  for(const ev of (S.manifest.events||[])){
    const d=Date.parse(ev.date); if(!isFinite(d)) continue;
    const f=(d-t0)/span; if(f<0||f>1) continue;
    const e=document.createElement('div');
    e.className='ev'; e.style.left=clamp(f*100,0,100)+'%';
    e.textContent=ev.label; e.title=`${ev.full||ev.label} — ${ev.date}`;
    monthsEl.appendChild(e);
  }

  // ---- level 2: bins ----
  S.periods.forEach((p,i)=>{
    const d=Date.parse(p.date+'T00:00:00Z');
    const t=document.createElement('div');
    t.className='btick'; t.dataset.k=i;
    t.style.left=pos(d)+'%';
    t.title=`${p.date} · bin ${p.bin} · ${p.season}`;
    t.onclick=()=>setPeriod(i);
    binsEl.appendChild(t);
  });

  $('#tl0').textContent=first.start;
  $('#tl1').textContent=last.end;
}
function buildSlider(){
  const s=$('#slider');
  s.max=Math.max(S.periods.length-1,0);
  s.value=S.periodIdx;
  s.oninput=()=>setPeriod(Number(s.value));
}
function setPeriod(i){
  S.periodIdx=clamp(i,0,S.periods.length-1);
  $('#slider').value=S.periodIdx;
  recolor();
  if(S.selected) renderInspector(S.selected);
}

/* ---------------------------------------------------------------- legend */
function buildLegend(){
  const el=$('#legend');
  let html='';
  if(isChangeMode()){
    const m=S.changeMetric;
    const stops = m==='date'?RAMPS.time : m==='magnitude'?RAMPS.fire : RAMPS.stab;
    const ramp=stops.map(s=>hex(s)).join(',');
    let lo='early', hi='late';
    if(m==='magnitude'){ lo='none'; hi='largest'; }
    if(m==='score'){ lo='weak'; hi='strongest'; }
    html=`<h3>detected break</h3>
      <div class="ramp" style="background:linear-gradient(90deg,${ramp})"></div>
      <div class="rlabels"><span>${lo}</span><span>${hi}</span></div>
      <div class="hintline">Computed on res-8 NDVI: harmonic regression with a
      step-regressor F-scan.<br>
      Grey cells have no break, or no res-8 shard is loaded.</div>`;
  }else if(S.mode==='delta'){
    html=`<h3>change vs baseline</h3>
      <div class="ramp" style="background:linear-gradient(90deg,${RAMPS.diff.map(hex).join(',')})"></div>
      <div class="rlabels"><span>&minus;${DELTA_SPAN}</span><span>0</span><span>+${DELTA_SPAN}</span></div>
      <div class="hintline">${idxLabel(S.deltaIdx||'ndvi')} difference against
        ${S.periods[S.baselineIdx]?S.periods[S.baselineIdx].date:'the baseline'}.</div>`;
  }else if(S.mode.startsWith('band:')){
    const b=S.mode.slice(5);
    html=`<h3>${bandLabel(b)}</h3>
      <div class="ramp" style="background:linear-gradient(90deg,${RAMPS.spec.map(hex).join(',')})"></div>
      <div class="rlabels"><span>0</span><span>${(BAND_SPAN[b]||0.3).toFixed(2)}</span></div>
      <div class="hintline">Surface reflectance, fixed display range so two
        resolutions stay comparable.</div>`;
  }else{
    const k=S.mode, r=idxRange(k);
    html=`<h3>${idxLabel(k)}</h3>
      <div class="ramp" style="background:linear-gradient(90deg,${idxRamp(k).map(hex).join(',')})"></div>
      <div class="rlabels"><span>${r[0]}</span><span>0</span><span>${r[1]}</span></div>
      <div class="hintline">${spec(k).desc||''}</div>`;
  }
  html+=`<div class="hintline" style="margin-top:7px;border-top:1px solid var(--line);padding-top:6px">
    ${S.resMode==='overview'?'res 7 overview (18,115 cells)':
      S.resMode==='regions'?'res 8 region shards':'res 7 overview + res 8 shards'}</div>`;
  el.innerHTML=html;
}

/* ---------------------------------------------------------------- extremes */
function buildExtremes(){
  const el=$('#extremes');
  if(!isChangeMode()){ el.style.display='none'; return; }
  el.style.display='block';
  const rows=[];
  for(const [region,block] of S.shards){
    if(!block.change) continue;
    const sc=block.change.break_score;
    for(let c=0;c<block.nCells;c++){
      const v=sc[c];
      if(!isFinite(v)) continue;
      rows.push({v, id:block.ids[c], region, c});
    }
  }
  rows.sort((a,b)=>b.v-a.v);
  const top=rows.slice(0,20);
  el.innerHTML=`<h3>strongest breaks</h3>`+
    (top.length?top.map(r=>`<div class="ex" data-id="${r.id}" data-region="${r.region}">
        <span class="nm">${r.id}</span><span class="vl">${r.v.toFixed(1)}</span></div>`).join('')
      :'<div style="color:var(--muted)">no res-8 shards loaded yet</div>');
  el.querySelectorAll('.ex').forEach(x=>{
    x.onclick=()=>{
      const blk=S.shards.get(x.dataset.region);
      if(!blk) return;
      const c=blk.ids.indexOf(x.dataset.id);
      if(c<0) return;
      selectCell(x.dataset.id,'rg');
      S.map.flyTo({center:[blk.lon[c],blk.lat[c]],zoom:13.5,duration:900});
    };
  });
}

/* ---------------------------------------------------------------- inspector */
function selectCell(id, which){
  S.selected=id;
  if(S.map && S.map.getLayer('hex-sel'))
    S.map.setFilter('hex-sel',['==',['get','id'],id]);
  renderInspector(id);
}
function blockFor(id){
  if(S.overview && S.overview.ids.includes(id)) return S.overview;
  for(const b of S.shards.values()) if(b.ids.includes(id)) return b;
  return null;
}
function renderInspector(id){
  const el=$('#insp');
  const B=blockFor(id);
  if(!B){ el.style.display='none'; return; }
  el.style.display='block';
  const c=B.ids.indexOf(id);
  const i0=S.periodIdx;
  const obs=[];
  for(let i=0;i<B.periods.length;i++) if(B.observed[i][c]) obs.push(i);
  const ndviAll=B.index.ndvi.map(a=>a[c]);
  const good=ndviAll.filter(v=>!isMissing(v));
  const hi=good.length?Math.max(...good):null, lo=good.length?Math.min(...good):null;

  let mv={d:0};
  for(let k=1;k<obs.length;k++){
    const x=ndviAll[obs[k-1]], y=ndviAll[obs[k]];
    if(isMissing(x)||isMissing(y)) continue;
    const d=Math.abs(y-x);
    if(d>mv.d) mv={d,i:obs[k-1],j:obs[k],x,y};
  }
  let narrative;
  if(!obs.length){
    narrative=`No observed bin for this cell at this resolution.`;
  }else if(mv.d<0.02){
    narrative=`A <b>spectrally quiet</b> cell: NDVI never moves more than 0.02 between
      consecutive observed bins.`;
  }else{
    const arrow=mv.y>mv.x?'&rarr;':'&larr;';
    narrative=`NDVI moved <b>${fmt(mv.x,3)} ${arrow} ${fmt(mv.y,3)}</b> between
      <b>${S.periods[mv.i].date}</b> and <b>${S.periods[mv.j].date}</b>, the largest single step
      in the record. The cell now reads ${fmt(ndviAll[i0],3)}, against a range of
      ${fmt(lo,3)} to ${fmt(hi,3)}.`;
  }

  const ribbon=obs.length?B.periods.map((p,i)=>{
    const v=ndviAll[i];
    const ok=B.observed[i][c]&&!isMissing(v);
    const r=idxRange('ndvi');
    return `<div class="rseg ${i===i0?'sel':''} ${ok?'':'dim'}"
      style="background:${ok?rampColor((v-r[0])/(r[1]-r[0]),idxRamp('ndvi')):'#2a2a2a'}"
      data-i="${i}" title="${S.periods[i].date} · NDVI ${ok?fmt(v,3):'no observation'}"></div>`;
  }).join(''):'';

  const heat=heatmapChart([
    {title:'reflectance', rows:S.manifest.bands.map(b=>({
        label:bandLabel(b), color:bandColor(b),
        values:B.periods.map((p,i)=>B.band[b][i][c])}))},
    {title:'indices', rows:S.manifest.indices.map(k=>({
        label:idxLabel(k), color:INDEX_COLORS[k]||'#9aa4bb',
        values:B.periods.map((p,i)=>B.index[k][i][c])}))},
  ]);
  const profile=spectrumProfile(S.manifest.bands.map(b=>({
    key:b, nm:((S.manifest.band_info||{})[b]||{}).nm,
    values:B.periods.map((p,i)=>B.band[b][i][c])})));

  // ---- change layer ----
  let changeHtml='';
  if(B.change){
    const ch=B.change;
    const bb=ch.break_bin[c], bd=ch.break_date[c];
    const mag=ch.break_magnitude[c], score=ch.break_score[c];
    const nobs=ch.n_obs_used[c], mi=ch.method[c];
    const method=(ch.methods&&ch.methods[mi])||'—';
    const epoch=B.epoch?Date.parse(B.epoch+'T00:00:00Z'):0;
    const breakDate=(bd!==65535&&epoch)?new Date(epoch+bd*86400000).toISOString().slice(0,10):'—';
    changeHtml=`<div class="sect">change layer (res-8 NDVI)</div>
      <div class="grid2">
        <div class="kv"><span>break bin</span><b>${bb===65535?'none':bb}</b></div>
        <div class="kv"><span>break date</span><b>${breakDate}</b></div>
        <div class="kv"><span>magnitude</span><b>${isFinite(mag)?fmt(mag,4):'—'}</b></div>
        <div class="kv"><span>score</span><b>${isFinite(score)?fmt(score,2):'—'}</b></div>
        <div class="kv"><span>obs used</span><b>${nobs}</b></div>
        <div class="kv"><span>method</span><b style="font-size:10.5px">${method}</b></div>
      </div>
      <div class="sub" style="margin:4px 0 0;font-size:10.5px">Rough by construction at
        one year of 16-day bins; the fields exist and round-trip, the numbers are
        not yet trustworthy (PHASE1 &sect;10).</div>`;
  }

  el.innerHTML=`
    <button class="close" title="Close (esc)">&times;</button>
    <h2>H3 cell biography</h2>
    <div class="sub">${B===S.overview?'res 7 (overview)':'res 8 (region shard)'} ·
      <code>${id}</code><br>
      ${(B.areaKm2[c]*1e6).toLocaleString(undefined,{maximumFractionDigits:0})} m² ·
      ${B.lat[c].toFixed(5)}, ${B.lon[c].toFixed(5)} · ${obs.length} of ${B.periods.length}
      bins observed</div>
    <div class="narr">${narrative}</div>

    <div class="sect">NDVI through the record &mdash; click to jump</div>
    <div class="ribbon">${ribbon}</div>

    <div class="sect">current bin (${S.periods[i0].date})</div>
    <div class="grid2">
      ${S.manifest.indices.map(k=>`<div class="kv"><span>${idxLabel(k)}</span><b>${fmt(B.index[k][i0][c],3)}</b></div>`).join('')}
      <div class="kv"><span>scenes per pixel</span><b>${B.nObs[i0][c]}</b></div>
      <div class="kv"><span>valid fraction</span><b>${fmt(B.validFraction[i0][c],2)}</b></div>
    </div>
    ${changeHtml}

    <div class="sect">spectra and indices through the record</div>
    ${heat}
    <div class="sub" style="margin:6px 0 0;font-size:10.5px">Colour is each series&rsquo;
      distance from its own record mean, in standard deviations.</div>
    <div class="sect">spectral profile &mdash; record mean, whisker is observed range</div>
    ${profile}
    <div class="sub" style="margin:5px 0 0;font-size:10.5px">Band-centre means; the axis
      starts at zero so a dark cell cannot look bright.</div>

    <div class="sect">map</div>
    <div style="display:flex;gap:7px;flex-wrap:wrap">
      <button id="fly">fly to this cell</button>
    </div>`;

  el.querySelector('.close').onclick=closeInsp;
  el.querySelectorAll('.rseg[data-i]').forEach(s=>s.onclick=()=>setPeriod(Number(s.dataset.i)));
  el.querySelector('#fly').onclick=()=>S.map.flyTo({center:[B.lon[c],B.lat[c]],zoom:15,duration:900});
  if(S.map) S.map.easeTo({center:[B.lon[c],B.lat[c]],duration:450});
}
function closeInsp(){
  S.selected=null; $('#insp').style.display='none';
  if(S.map&&S.map.getLayer('hex-sel'))
    S.map.setFilter('hex-sel',['==',['get','id'],'__none__']);
}

/* ---------------------------------------------------------------- charts */
const HEAT_STEPS=['#3f8fd4','#3579b8','#2c6398','#2a4a6c','#343a49','#6b3f3c','#a14f48','#cf6455','#f2836a'];
const HEAT_CUTS=[-2.2,-1.6,-1.0,-0.5,0.5,1.0,1.6,2.2];
const HEAT_MISSING='#0b0d12';
function heatBin(z){ for(let i=0;i<HEAT_CUTS.length;i++) if(z<HEAT_CUTS[i]) return i; return HEAT_STEPS.length-1; }

function heatmapChart(groups){
  const W=400, PL=106, PR=8, PT=13, PB=21;
  const n=S.periods.length;
  if(!n) return '<div style="color:var(--muted);padding:10px 0">no bins</div>';
  const CW=(W-PL-PR)/n;
  const RH=13, RGAP=2, HEAD=14, GSEP=6;
  const items=[];
  let y=PT;
  groups.forEach(grp=>{
    items.push({type:'head',label:grp.title,y}); y+=HEAD;
    grp.rows.forEach(r=>{
      const fin=r.values.filter(v=>!isMissing(v)&&isFinite(v));
      const mean=fin.length?fin.reduce((a,b)=>a+b,0)/fin.length:null;
      const sd=fin.length>1?Math.sqrt(fin.reduce((a,b)=>a+(b-mean)*(b-mean),0)/fin.length):null;
      items.push({type:'row',row:r,mean,sd,y}); y+=RH+RGAP;
    });
    y+=GSEP;
  });
  const plotBottom=y-GSEP, H=plotBottom+PB;
  let g='';
  for(const ev of (S.manifest.events||[])){
    const d=Date.parse(ev.date); if(!isFinite(d)) continue;
    S.periods.forEach((p,i)=>{
      const pd=Date.parse(p.date+'T00:00:00Z');
      if(Math.abs(pd-d)<75*86400000)
        g+=`<rect x="${(PL+i*CW+0.5).toFixed(1)}" y="${PT-6}" width="${Math.max(CW-1,1).toFixed(1)}"
              height="3" fill="#e0a458" opacity="0.9"><title>${ev.full||ev.label||'event'}</title></rect>`;
    });
  }
  items.forEach(it=>{
    if(it.type==='head'){
      g+=`<text x="4" y="${(it.y+10).toFixed(1)}" fill="#7f8899" font-size="8.5"
             letter-spacing="0.7">${it.label.toUpperCase()}</text>`;
      return;
    }
    const r=it.row;
    g+=`<rect x="4" y="${(it.y+4).toFixed(1)}" width="6" height="6" rx="1.5" fill="${r.color}"/>`;
    g+=`<text x="15" y="${(it.y+9.5).toFixed(1)}" fill="#c4ccdd" font-size="9.5">${r.label}</text>`;
    for(let i=0;i<n;i++){
      const v=r.values[i];
      let fill, z=null;
      if(isMissing(v)||!isFinite(v)) fill=HEAT_MISSING;
      else if(it.sd==null||it.sd<1e-9){ fill=HEAT_STEPS[4]; z=0; }
      else { z=(v-it.mean)/it.sd; fill=HEAT_STEPS[heatBin(z)]; }
      const tip=isMissing(v)?`${S.periods[i].date} · ${r.label} · no observation`
        :`${S.periods[i].date} · ${r.label} ${fmt(v,4)} · `+(z==null?'':(z>=0?'+':'')+z.toFixed(1)+'σ vs record mean');
      g+=`<rect x="${(PL+i*CW+0.5).toFixed(2)}" y="${(it.y+0.5).toFixed(1)}"
            width="${Math.max(CW-1,1).toFixed(2)}" height="${RH-1}" fill="${fill}" rx="1"><title>${tip}</title></rect>`;
    }
  });
  if(S.periodIdx>=0 && S.periodIdx<n)
    g+=`<rect x="${(PL+S.periodIdx*CW+0.5).toFixed(1)}" y="${PT-2}" width="${Math.max(CW-1,1).toFixed(1)}"
          height="${(plotBottom-PT+2).toFixed(1)}" fill="none" stroke="#fff" stroke-width="1" opacity="0.85" rx="1"/>`;
  const stride=Math.max(1,Math.ceil(n/8));
  let last=-99;
  S.periods.forEach((p,i)=>{
    const mid=PL+i*CW+CW/2;
    const forced=i===n-1&&(i-last)>=Math.ceil(stride/2);
    if(i%stride&&!forced) return;
    last=i;
    g+=`<line x1="${mid.toFixed(1)}" y1="${plotBottom}" x2="${mid.toFixed(1)}" y2="${plotBottom+4}" stroke="#3a4152"/>`;
    g+=`<text x="${mid.toFixed(1)}" y="${H-6}" fill="#98a2b8" font-size="8.5" text-anchor="middle">${p.date.slice(5)}</text>`;
  });
  return `<svg class="chart heat" viewBox="0 0 ${W} ${H}">${g}</svg>`+
    `<div class="heatleg"><span>&minus;2&sigma;</span>
      <div class="hlbar">${HEAT_STEPS.map(c=>`<i style="background:${c}"></i>`).join('')}</div>
      <span>+2&sigma;</span><span class="hlsep"></span><i class="hlmiss"></i><span>unobserved</span></div>`;
}

function niceCeil(v){
  if(!(v>0)) return 1;
  const e=Math.floor(Math.log10(v)), f=v/Math.pow(10,e);
  const steps=[1,1.2,1.5,2,2.5,3,4,5,6,8,10];
  const s=steps.find(x=>f<=x)||10;
  return s*Math.pow(10,e);
}
function spectrumProfile(bands){
  const W=400, PL=40, PR=13, PT=17, PB=34, H=138;
  const rows=bands.map(b=>{
    const vals=b.values.filter(v=>!isMissing(v)&&isFinite(v));
    if(!vals.length) return null;
    return {key:b.key,nm:b.nm,
            mean:vals.reduce((a,x)=>a+x,0)/vals.length,
            min:Math.min(...vals),max:Math.max(...vals)};
  }).filter(Boolean);
  if(!rows.length) return '<div style="color:var(--muted)">no observations</div>';
  const maxV=niceCeil(Math.max(...rows.map(r=>r.max)));
  const nmMin=Math.min(...rows.map(r=>r.nm));
  const nmMax=Math.max(...rows.map(r=>r.nm));
  const lx=nm=>PL+(Math.log10(nm)-Math.log10(nmMin))/(Math.log10(nmMax)-Math.log10(nmMin))*(W-PL-PR);
  const ly=v=>PT+(1-v/maxV)*(H-PT-PB);
  let g='';
  for(let i=0;i<=4;i++){
    const v=maxV*i/4, y=ly(v);
    g+=`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}" stroke="#2a3040"/>`;
    g+=`<text x="${PL-4}" y="${(y+3).toFixed(1)}" fill="#98a2b8" font-size="8" text-anchor="end">${v.toFixed(2)}</text>`;
  }
  const pts=rows.map(r=>[lx(r.nm),ly(r.mean)]);
  g+=`<polyline points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}"
        fill="none" stroke="#7fd4c1" stroke-width="1.4" opacity="0.85"/>`;
  rows.forEach((r,i)=>{
    const x=lx(r.nm), y=ly(r.mean);
    const ylo=ly(r.min), yhi=ly(r.max);
    g+=`<line x1="${x.toFixed(1)}" y1="${ylo.toFixed(1)}" x2="${x.toFixed(1)}" y2="${yhi.toFixed(1)}"
          stroke="#7fd4c1" stroke-width="1.2" opacity="0.5"/>`;
    g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${bandColor(r.key)}"
          stroke="#12141a" stroke-width="1"><title>${bandLabel(r.key)}: mean ${fmt(r.mean,4)}</title></circle>`;
    g+=`<text x="${x.toFixed(1)}" y="${H-PB+13}" fill="#98a2b8" font-size="8" text-anchor="middle">${r.nm}</text>`;
  });
  return `<svg class="chart spec" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}

/* ---------------------------------------------------------------- controls */
function bind(){
  $('#resmode').onchange=e=>{ S.resMode=e.target.value; applyResMode(); buildLegend(); };
  $('#season').onchange=e=>{ S.season=e.target.value; buildTimeline(); recolor(); };
  $('#opacity').oninput=e=>{
    S.opacity=Number(e.target.value);
    if(S.map&&S.map.getLayer('ov-fill')) S.map.setPaintProperty('ov-fill','fill-opacity',S.opacity/100);
    if(S.map&&S.map.getLayer('rg-fill')) S.map.setPaintProperty('rg-fill','fill-opacity',S.opacity/100);
  };
  $('#baseline').onchange=e=>{ S.baselineIdx=Number(e.target.value); recolor(); buildLegend(); };
  $('#basemap').onclick=()=>{
    S.satellite=!S.satellite;
    const b=$('#basemap');
    b.classList.toggle('on',S.satellite);
    b.textContent=S.satellite?'on':'off';
    if(S.map&&S.map.getLayer('basemap'))
      S.map.setLayoutProperty('basemap','visibility',S.satellite?'visible':'none');
  };
  $('#play').onclick=togglePlay;
  $('#speed').onchange=e=>{ S.speed=Number(e.target.value); if(S.playing) togglePlay(), togglePlay(); };
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
    if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
    else if(e.key==='ArrowLeft'){ setPeriod(S.periodIdx-1); }
    else if(e.key==='ArrowRight'){ setPeriod(S.periodIdx+1); }
    else if(e.key==='Escape'){ closeInsp(); }
  });
}
function buildBaselineOptions(){
  const sel=$('#baseline'); sel.innerHTML='';
  S.periods.forEach((p,i)=>{
    const o=document.createElement('option');
    o.value=i; o.textContent=`${p.date} (bin ${p.bin})`;
    sel.appendChild(o);
  });
  sel.value=S.baselineIdx;
}
function togglePlay(){
  S.playing=!S.playing;
  $('#play').innerHTML=S.playing?'&#10073;&#10073;':'&#9654;';
  if(S.timer){ clearInterval(S.timer); S.timer=null; }
  if(S.playing){
    S.timer=setInterval(()=>{
      const sh=shownPeriods();
      if(!sh.length) return;
      const i=sh.findIndex(p=>p.bin===S.periods[S.periodIdx].bin);
      const nxt=sh[(i+1)%sh.length];
      setPeriod(S.periods.indexOf(nxt));
    },S.speed);
  }
}
function setLoading(msg){ $('#loading').innerHTML=`<div>${msg}</div><div class="bar2"><div></div></div>`; }
function hideLoading(){ const el=$('#loading'); if(el) el.style.display='none'; }
function failLoading(err){
  $('#loading').innerHTML=`<div style="max-width:560px;text-align:center;line-height:1.7">
    <div style="color:#e0a458;font-size:15px;margin-bottom:8px">could not load the regional bundle</div>
    <div>${err.message}</div></div>`;
}
function syncPanelTop(){
  const bar=$('#bar');
  if(!bar) return;
  const h=bar.getBoundingClientRect().height;
  document.documentElement.style.setProperty('--paneltop',(h+10)+'px');
}

bind();
window.addEventListener('resize',syncPanelTop);
syncPanelTop();
boot();
</script>
