name: pages

# Publish this repository's site: the Rookery Bay viewer and its companion
# pages. The site is the pilot; it opens straight into it.
#
# What goes on the site:
#
#   viewer/pilot.html        the Rookery Bay viewer  <- the entry point
#   viewer/index.html        a redirect to pilot.html (old links keep working)
#   viewer/regional.html     the dataset viewer, reached by URL with ?manifest=
#   viewer/probe.html        the isolated load probe
#   data/rookery_bay_h3_*    the three pilot bundles
#
# What does not, and must not:
#
#   data/regional/           the regional build output -- the publisher can
#                            split it into datasets (D-31), but that
#                            deployment is deferred (D-33)
#   data/mosaic_cache/       15.3 GB for 2017 alone (D-29)
#   data/cache_regional/     70 MB of npz
#
# The size budget still runs before the upload: it is cheap, and it catches the
# case where someone re-adds an archive to this repo.

on:
  push:
    branches: [main]
    paths:
      - "viewer/**"
      - "data/rookery_bay_h3_*"
      - "tools/measure/site_budget.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p site/viewer site/data
          cp viewer/*.html site/viewer/
          cp data/rookery_bay_h3_res*.bin.gz site/data/
          cp data/rookery_bay_h3_meta.json site/data/
          printf '%s\n' \
            '<!doctype html><meta charset="utf-8"><title>h3lab</title>' \
            '<meta http-equiv="refresh" content="0;url=viewer/pilot.html">' \
            '<a href="viewer/pilot.html">Rookery Bay pilot</a>' > site/index.html
          echo "site assembled:"
          du -sh site
          find site -type f | wc -l

      - name: Check the Pages size budget
        run: python3 tools/measure/site_budget.py --site site --check

      - uses: actions/configure-pages@v5
        with:
          # Best-effort: turn Pages on with source = "GitHub Actions".
          #
          # This needs repository *admin*, which the workflow token does not
          # have, so on a repository that has never had Pages enabled this step
          # fails with 403 "Resource not accessible by integration" and the
          # job stops here. That is expected once. Enable it by hand:
          #
          #     Settings -> Pages -> Build and deployment -> Source: GitHub Actions
          #
          # then re-run this workflow (Actions -> pages -> Re-run all jobs) or
          # push again. Every later run deploys without the manual step.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
